<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frog</title>
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="assets/output.css">
    <script src="script.js" type="module" defer></script>
</head>
<body>

  <main>
    <h1>Frog Hopping Game</h1>
    <p>Use your arrows to hop around.</p>
    <section id="pond">
      <div class="water">
        <div class="lily">
          <div class="frog"></div>
        </div>
      </div>

      <div class="water">
        <div class="lily"></div>
      </div>

      <div class="water">
        <div class="lily"></div>
      </div>

      <div class="water">
        <div class="lily"></div>
      </div>
    </section>
  </main>

</body>
</html>
